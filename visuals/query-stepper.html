<title>SQL Query Stepper</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Kalam:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: source tables float on top, SQL on the left with the running line lit, "result so far" table on the right; one click = one line of the query */
:root{
  --paper:#fbf6e9; --ink:#141414; --pow:#ffd23f; --red:#e8453c; --blue:#2f7de1; --ok:#2fa84f; --muted:#6b6658; --card:#ffffff;
  --display:"Bangers",Impact,"Arial Black",sans-serif;
  --body:"Kalam","Comic Sans MS","Segoe Print",cursive;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
body{background:var(--paper);color:var(--ink);font-family:var(--body);
  background-image:radial-gradient(rgba(20,20,20,.10) 1.2px,transparent 1.3px);background-size:9px 9px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);letter-spacing:.05em;font-size:clamp(30px,5vw,52px);margin:0;line-height:1}
select,button{font-family:var(--display);letter-spacing:.05em;font-size:18px;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);background:var(--pow);color:var(--ink);padding:6px 14px;cursor:pointer}
select{background:var(--card)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,select:focus-visible{outline:3px dashed var(--red);outline-offset:3px}
button:active:not(:disabled){transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.label{font-family:var(--display);letter-spacing:.06em;font-size:16px;display:inline-block;background:var(--ink);color:var(--paper);padding:2px 10px}
/* sources */
.sources{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.src{background:var(--card);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:6px;transition:transform .4s, box-shadow .4s, opacity .4s;opacity:.55;animation:float 4s ease-in-out infinite}
.src:nth-child(2){animation-delay:-1.3s}.src:nth-child(3){animation-delay:-2.6s}
.src.live{opacity:1;box-shadow:7px 7px 0 var(--pow),7px 7px 0 3px var(--ink);transform:translateY(-4px) rotate(-1deg)}
@keyframes float{50%{translate:0 -5px}}
.src .nm{font-family:var(--display);letter-spacing:.05em;font-size:18px;margin-bottom:4px}
.src .al{background:var(--pow);border:2px solid var(--ink);padding:0 6px;margin-left:6px;font-family:var(--mono);font-size:13px}
/* main */
.main{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:18px;align-items:start}
@media (max-width:820px){.main{grid-template-columns:minmax(0,1fr)}}
.sql{background:var(--ink);color:#f3efe2;border:4px solid var(--ink);box-shadow:8px 8px 0 var(--pow);font-family:var(--mono);font-size:clamp(12px,1.5vw,15px);line-height:1.7;padding:12px 0;overflow-x:auto}
.sql div{padding:0 14px;white-space:pre;transition:background .3s,color .3s;opacity:.45}
.sql div.done{opacity:.8}
.sql div.now{background:var(--pow);color:var(--ink);opacity:1;font-weight:700}
.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.say{position:relative;background:var(--card);border:4px solid var(--ink);border-radius:22px;padding:12px 18px;font-size:clamp(17px,2vw,21px);line-height:1.35}
.say b{background:var(--pow);padding:0 .2em}
.step-t{font-family:var(--display);letter-spacing:.05em;font-size:clamp(24px,3vw,34px);margin:0;line-height:1}
.count{font-family:var(--mono);font-size:14px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;font-family:var(--mono);font-size:clamp(12px,1.5vw,15px);background:var(--card);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink)}
th,td{border:2px solid var(--ink);padding:5px 10px;text-align:center;white-space:nowrap}
th{background:var(--ink);color:var(--paper)}
th.new{background:var(--pow);color:var(--ink)}
.src table{box-shadow:none;border-width:2px;font-size:12px}
.src th,.src td{padding:2px 7px;border-width:1px}
td.null{color:var(--red);font-weight:700}
tr.in{animation:rowin .45s both}
@keyframes rowin{0%{opacity:0;transform:translateX(-30px) scale(.9)}100%{opacity:1;transform:none}}
tr.out td{background:#fde0de;text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:var(--red)}
tr.out{animation:rowin .45s both, outpulse .6s .9s both}
@keyframes outpulse{to{opacity:.45}}
.nav{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:14px;height:14px;border:2px solid var(--ink);background:var(--card);padding:0;box-shadow:none;cursor:pointer}
.dot.on{background:var(--ink)}
.hint{font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>Query Stepper</h1>
    <label class="hint" for="pick">Problem
      <select id="pick"></select>
    </label>
  </header>

  <div>
    <span class="label">The tables (example rows)</span>
    <div class="sources" id="sources" style="margin-top:10px"></div>
  </div>

  <div class="main">
    <div class="sql" id="sql" aria-label="SQL query"></div>
    <div class="panel">
      <h2 class="step-t" id="stepTitle"></h2>
      <div class="say" id="say"></div>
      <span class="count" id="count"></span>
      <div class="tw" id="result"></div>
    </div>
  </div>

  <div class="nav">
    <button id="prev" type="button">◀ Back</button>
    <button id="next" type="button">Next line ▶</button>
    <div class="dots" id="dots"></div>
    <span class="hint">Arrow keys work too. Read in the order SQL runs it, not the order it is written.</span>
  </div>
</div>

<script>
/* ---------- tiny SQL engine on example rows ---------- */
const pre=(r,a)=>Object.fromEntries(Object.entries(r).map(([k,v])=>[a+'.'+k,v]));
const from=(T,t,a)=>T[t].map(r=>pre(r,a));
const cross=(rows,T,t,a)=>rows.flatMap(r=>from(T,t,a).map(x=>({...r,...x})));
function join(rows,T,t,a,pred,left){
  const blank=Object.fromEntries(Object.keys(T[t][0]).map(k=>[a+'.'+k,null]));
  return rows.flatMap(r=>{
    const m=from(T,t,a).map(x=>({...r,...x})).filter(pred);
    return m.length?m:(left?[{...r,...blank}]:[]);
  });
}
const mark=(rows,pred)=>rows.map(r=>({...r,_out:!pred(r)}));
const keep=rows=>rows.filter(r=>!r._out).map(({_out,...r})=>r);
function group(rows,keys){
  const order=[];const g={};
  rows.forEach(r=>{const k=keys.map(c=>r[c]).join('|');if(!g[k]){g[k]=[];order.push(k)}g[k].push(r)});
  return {order,g};
}
const day=d=>d==null?null:d+' Jan';

/* ---------- problems ---------- */
const P=[
{
  name:"Students and Examinations",
  tables:{
    Students:[{student_id:1,student_name:"Ravi"},{student_id:2,student_name:"Sita"}],
    Subjects:[{subject_name:"English"},{subject_name:"Maths"},{subject_name:"Physics"}],
    Examinations:[{student_id:1,subject_name:"Maths"},{student_id:1,subject_name:"Maths"},{student_id:1,subject_name:"Physics"},{student_id:2,subject_name:"Maths"}]
  },
  alias:{Students:"s",Subjects:"sub",Examinations:"e"},
  sql:["SELECT s.student_id, s.student_name, sub.subject_name,","       COUNT(e.subject_name) AS attended_exams","FROM Students s","CROSS JOIN Subjects sub","LEFT JOIN Examinations e","  ON  e.student_id   = s.student_id","  AND e.subject_name = sub.subject_name","GROUP BY s.student_id, s.student_name, sub.subject_name","ORDER BY s.student_id, sub.subject_name;"],
  steps:[
    {lines:[2],uses:["Students"],title:"FROM: start with students",say:"SQL always starts at <b>FROM</b>, not SELECT. Take the Students table and call it <b>s</b>.",
      run:(T)=>from(T,"Students","s")},
    {lines:[3],uses:["Subjects"],title:"CROSS JOIN: the empty register",say:"Every student is paired with <b>every</b> subject. No ON rule. 2 students × 3 subjects = <b>6 boxes</b>. This is the empty attendance register.",
      run:(T,p)=>cross(p,T,"Subjects","sub")},
    {lines:[4,5,6],uses:["Examinations"],title:"LEFT JOIN: mark the register",say:"Each exam goes into the box with the <b>same student AND same subject</b>. Ravi took Maths twice, so his Maths box splits into <b>2 rows</b>. Boxes with no exam stay, with <b>NULL</b> (that's the LEFT).",
      run:(T,p)=>join(p,T,"Examinations","e",r=>r["e.student_id"]===r["s.student_id"]&&r["e.subject_name"]===r["sub.subject_name"],true)},
    {lines:[7],uses:[],title:"GROUP BY: one pile per box",say:"Rows with the same student + subject go into one pile (same colour). Ravi–Maths is one pile with 2 rows. Every other pile has 1 row, some of them NULL.",
      run:(T,p)=>p,group:["s.student_id","sub.subject_name"]},
    {lines:[0,1],uses:[],title:"SELECT + COUNT: squash each pile",say:"Each pile becomes one row. <b>COUNT(e.subject_name)</b> skips NULL, so empty boxes give <b>0</b>. (COUNT(*) would wrongly give 1.)",
      run:(T,p)=>{const {order,g}=group(p,["s.student_id","sub.subject_name"]);return order.map(k=>{const rs=g[k];return{"s.student_id":rs[0]["s.student_id"],"s.student_name":rs[0]["s.student_name"],"sub.subject_name":rs[0]["sub.subject_name"],"attended_exams":rs.filter(r=>r["e.subject_name"]!=null).length}})}},
    {lines:[8],uses:[],title:"ORDER BY: sort it",say:"Sort by student, then subject. Done: every student × every subject, with zeros.",
      run:(T,p)=>[...p].sort((a,b)=>a["s.student_id"]-b["s.student_id"]||a["sub.subject_name"].localeCompare(b["sub.subject_name"]))}
  ]
},
{
  name:"Average Time of Process per Machine",
  tables:{
    Activity:[
      {machine_id:0,process_id:0,activity_type:"start",timestamp:1.0},{machine_id:0,process_id:0,activity_type:"end",timestamp:4.0},
      {machine_id:0,process_id:1,activity_type:"start",timestamp:2.0},{machine_id:0,process_id:1,activity_type:"end",timestamp:4.0},
      {machine_id:1,process_id:0,activity_type:"start",timestamp:0.5},{machine_id:1,process_id:0,activity_type:"end",timestamp:1.5},
      {machine_id:1,process_id:1,activity_type:"start",timestamp:1.0},{machine_id:1,process_id:1,activity_type:"end",timestamp:4.0}]
  },
  alias:{Activity:"s and e"},
  sql:["SELECT s.machine_id,","       ROUND(AVG(e.timestamp - s.timestamp)::numeric, 3) AS processing_time","FROM Activity s","JOIN Activity e","  ON  s.machine_id    = e.machine_id","  AND s.process_id    = e.process_id","  AND s.activity_type = 'start'","  AND e.activity_type = 'end'","GROUP BY s.machine_id;"],
  steps:[
    {lines:[2],uses:["Activity"],title:"FROM: copy s",say:"First copy of Activity, called <b>s</b>. All 8 rows for now.",
      run:(T)=>from(T,"Activity","s")},
    {lines:[6],uses:[],title:"Rule 3: s keeps only start rows",say:"<b>s.activity_type = 'start'</b>. End rows in s can never find a partner, so they drop out. s is now the 'start register'.",
      run:(T,p)=>mark(p,r=>r["s.activity_type"]==="start")},
    {lines:[3,4,5,7],uses:["Activity"],title:"JOIN copy e: find each start's end",say:"Second copy, <b>e</b>. Each start row looks for the row with the <b>same machine, same process, and type 'end'</b>. Exactly one partner each. Start and end now sit in <b>one row</b>.",
      run:(T,p)=>join(keep(p),T,"Activity","e",r=>r["s.machine_id"]===r["e.machine_id"]&&r["s.process_id"]===r["e.process_id"]&&r["e.activity_type"]==="end",false)},
    {lines:[1],uses:[],title:"e.timestamp − s.timestamp",say:"Both times are in the same row now, so SQL can subtract them. That was the whole point of the self-join.",
      run:(T,p)=>p.map(r=>({"s.machine_id":r["s.machine_id"],"s.process_id":r["s.process_id"],"s.timestamp":r["s.timestamp"],"e.timestamp":r["e.timestamp"],"e − s":+(r["e.timestamp"]-r["s.timestamp"]).toFixed(3)}))},
    {lines:[8],uses:[],title:"GROUP BY machine",say:"One pile per machine (same colour).",
      run:(T,p)=>p,group:["s.machine_id"]},
    {lines:[0,1],uses:[],title:"AVG + ROUND: squash each pile",say:"Average of each pile. Machine 0: (3 + 2) ÷ 2 = 2.5. Machine 1: (1 + 3) ÷ 2 = 2. <b>::numeric</b> lets ROUND go to 3 decimals.",
      run:(T,p)=>{const {order,g}=group(p,["s.machine_id"]);return order.map(k=>{const rs=g[k];const a=rs.reduce((x,r)=>x+r["e − s"],0)/rs.length;return{"s.machine_id":rs[0]["s.machine_id"],"processing_time":a.toFixed(3)}})}}
  ]
},
{
  name:"Rising Temperature",
  tables:{Weather:[{id:1,recordDate:1,temperature:10},{id:2,recordDate:2,temperature:25},{id:3,recordDate:3,temperature:20},{id:4,recordDate:4,temperature:30}]},
  alias:{Weather:"T and Y"},
  fmt:{"recordDate":day},
  sql:["SELECT T.id","FROM Weather T","JOIN Weather Y","  ON T.recordDate - Y.recordDate = 1","WHERE T.temperature > Y.temperature;"],
  steps:[
    {lines:[1],uses:["Weather"],title:"FROM: copy T (today)",say:"First copy, called <b>T</b>. Each row is a 'today'.",
      run:(T)=>from(T,"Weather","T")},
    {lines:[2,3],uses:["Weather"],title:"JOIN copy Y: the day before",say:"Each T row looks for a Y row where <b>T's date − Y's date = 1</b>. That makes Y yesterday. 1 Jan has no yesterday, so it drops (plain JOIN).",
      run:(T,p)=>join(p,T,"Weather","Y",r=>r["T.recordDate"]-r["Y.recordDate"]===1,false)},
    {lines:[4],uses:[],title:"WHERE: was today hotter?",say:"Now both temperatures sit in one row, so compare them. 3 Jan (20) was not hotter than 2 Jan (25), so it's crossed out.",
      run:(T,p)=>mark(p,r=>r["T.temperature"]>r["Y.temperature"])},
    {lines:[0],uses:[],title:"SELECT T.id",say:"Keep only the ids that survived: days hotter than the day before.",
      run:(T,p)=>keep(p).map(r=>({"T.id":r["T.id"]}))}
  ]
},
{
  name:"Employee Bonus",
  tables:{Employee:[{empId:1,name:"Ravi"},{empId:2,name:"Sita"},{empId:3,name:"Om"}],Bonus:[{empId:1,bonus:500},{empId:2,bonus:2000}]},
  alias:{Employee:"e",Bonus:"b"},
  sql:["SELECT e.name, b.bonus","FROM Employee e","LEFT JOIN Bonus b ON e.empId = b.empId","WHERE b.bonus < 1000 OR b.bonus IS NULL;"],
  steps:[
    {lines:[1],uses:["Employee"],title:"FROM: employees",say:"Start with all 3 employees.",
      run:(T)=>from(T,"Employee","e")},
    {lines:[2],uses:["Bonus"],title:"LEFT JOIN bonus",say:"Attach each person's bonus. Om has no bonus row, but <b>LEFT</b> keeps him, with NULL.",
      run:(T,p)=>join(p,T,"Bonus","b",r=>r["e.empId"]===r["b.empId"],true)},
    {lines:[3],uses:[],title:"WHERE: under 1000, or none",say:"Sita (2000) is crossed out. Om survives only because of <b>OR b.bonus IS NULL</b>. Without it, NULL &lt; 1000 is not true and Om would vanish.",
      run:(T,p)=>mark(p,r=>r["b.bonus"]==null||r["b.bonus"]<1000)},
    {lines:[0],uses:[],title:"SELECT name, bonus",say:"Done: Ravi (500) and Om (NULL).",
      run:(T,p)=>keep(p).map(r=>({"e.name":r["e.name"],"b.bonus":r["b.bonus"]}))}
  ]
},
{
  name:"Managers with at Least 5 Direct Reports",
  tables:{Employee:[{id:1,name:"Raja",managerId:null},{id:2,name:"Ravi",managerId:1},{id:3,name:"Sita",managerId:1},{id:4,name:"Kirti",managerId:1},{id:5,name:"Om",managerId:2}]},
  alias:{Employee:"w and m"},
  sql:["SELECT m.name","FROM Employee w          -- w = workers","JOIN Employee m          -- m = managers","  ON w.managerId = m.id","GROUP BY m.id, m.name","HAVING COUNT(*) >= 3;   -- real problem: 5"],
  steps:[
    {lines:[1],uses:["Employee"],title:"FROM: copy w (workers)",say:"First copy, called <b>w</b>. Read every row as <b>a worker holding a slip with his boss's number</b> (managerId). Ravi's slip says 1, Om's says 2.",
      run:(T)=>from(T,"Employee","w")},
    {lines:[2,3],uses:["Employee"],title:"JOIN copy m: find each worker's boss",say:"Second copy, called <b>m</b>. Each worker walks to the m row whose <b>id</b> matches his slip: <b>w.managerId = m.id</b>. Ravi, Sita and Kirti all find Raja (id 1). Om finds Ravi (id 2). Raja's slip is NULL, so he finds no boss and drops (plain JOIN).",
      run:(T,p)=>join(p,T,"Employee","m",r=>r["w.managerId"]===r["m.id"],false)},
    {lines:[4],uses:[],title:"GROUP BY the boss",say:"Now group by the <b>m</b> side, the boss. Raja's pile has 3 workers. Ravi's pile has 1 (Om). Note: we group by m, not w, because we're counting <b>per boss</b>.",
      run:(T,p)=>p,group:["m.id"]},
    {lines:[5],uses:[],title:"Squash + HAVING: 3 or more?",say:"Each pile becomes one row, with its count. Raja = 3, Ravi = 1. <b>HAVING COUNT(*) &gt;= 3</b> crosses out Ravi. (Mini example uses 3; LeetCode uses 5.)",
      run:(T,p)=>{const {order,g}=group(p,["m.id"]);return mark(order.map(k=>({"m.id":g[k][0]["m.id"],"m.name":g[k][0]["m.name"],"COUNT(*)":g[k].length})),r=>r["COUNT(*)"]>=3)}},
    {lines:[0],uses:[],title:"SELECT m.name",say:"Only Raja survives. Show his name from the <b>m</b> copy, because he's the boss.",
      run:(T,p)=>keep(p).map(r=>({"m.name":r["m.name"]}))}
  ]
}
];

/* ---------- render ---------- */
const $=id=>document.getElementById(id);
const COLORS=["#dbe8fb","#fde0de","#fff1b8","#dcf2df","#eadcf7","#fbe3cc"];
let q=0,s=0,cache=[];
function fmtVal(p,k,v){
  if(v==null)return null;
  const base=k.split('.').pop();
  return p.fmt&&p.fmt[base]?p.fmt[base](v):v;
}
function tableHTML(p,rows,{prevCols=[],groupKeys=null,anim=true}={}){
  if(!rows.length)return '<p class="hint">No rows.</p>';
  const cols=Object.keys(rows[0]).filter(c=>c!=="_out");
  let gi={},n=0;
  const head='<tr>'+cols.map(c=>`<th class="${anim&&prevCols.length&&!prevCols.includes(c)?'new':''}">${c}</th>`).join('')+'</tr>';
  const body=rows.map((r,i)=>{
    let style='';
    if(groupKeys){const k=groupKeys.map(c=>r[c]).join('|');if(!(k in gi))gi[k]=n++;style=`style="background:${COLORS[gi[k]%COLORS.length]}"`}
    const cls=[anim?'in':'',r._out?'out':''].join(' ');
    return `<tr class="${cls}" style="animation-delay:${anim?Math.min(i*90,900):0}ms">`+cols.map(c=>{const v=fmtVal(p,c,r[c]);return v==null?`<td class="null" ${style}>NULL</td>`:`<td ${style}>${v}</td>`}).join('')+'</tr>';
  }).join('');
  return `<table>${head}${body}</table>`;
}
function load(i){
  q=i;s=0;const p=P[q];
  cache=[];let prev=null;
  p.steps.forEach(st=>{prev=st.run(p.tables,prev);cache.push(prev)});
  $('sources').innerHTML=Object.keys(p.tables).map(t=>`<div class="src" data-t="${t}"><div class="nm">${t}<span class="al">${p.alias[t]}</span></div>${tableHTML(p,p.tables[t],{anim:false})}</div>`).join('');
  $('sql').innerHTML=p.sql.map(l=>`<div>${l.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</div>`).join('');
  $('dots').innerHTML=p.steps.map((_,k)=>`<button class="dot" type="button" aria-label="Step ${k+1}" data-k="${k}"></button>`).join('');
  [...document.querySelectorAll('.dot')].forEach(d=>d.onclick=()=>show(+d.dataset.k));
  show(0);
}
function show(k){
  const p=P[q];s=Math.max(0,Math.min(p.steps.length-1,k));const st=p.steps[s];
  const done=new Set(p.steps.slice(0,s).flatMap(x=>x.lines));
  [...$('sql').children].forEach((d,i)=>{d.className=st.lines.includes(i)?'now':(done.has(i)?'done':'')});
  [...document.querySelectorAll('.src')].forEach(e=>e.classList.toggle('live',st.uses.includes(e.dataset.t)));
  $('stepTitle').textContent=`Step ${s+1}. ${st.title}`;
  $('say').innerHTML=st.say;
  const rows=cache[s];
  const prevCols=s>0&&cache[s-1].length?Object.keys(cache[s-1][0]):[];
  const live=rows.filter(r=>!r._out).length;
  $('count').textContent=rows.some(r=>r._out)?`${live} of ${rows.length} rows survive`:`${rows.length} row${rows.length===1?'':'s'} so far`;
  $('result').innerHTML=tableHTML(p,rows,{prevCols,groupKeys:st.group||null});
  [...document.querySelectorAll('.dot')].forEach((d,i)=>d.classList.toggle('on',i===s));
  $('prev').disabled=s===0;$('next').disabled=s===p.steps.length-1;
}
$('pick').innerHTML=P.map((p,i)=>`<option value="${i}">${p.name}</option>`).join('');
$('pick').onchange=e=>load(+e.target.value);
$('next').onclick=()=>show(s+1);$('prev').onclick=()=>show(s-1);
document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowRight')show(s+1);if(e.key==='ArrowLeft')show(s-1)});
load(0);
</script>
